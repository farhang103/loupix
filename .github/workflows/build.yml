name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Merges run one at a time, so two can't claim the same version number.
concurrency:
  group: build-${{ github.ref }}

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # lets a merge to main publish a GitHub Release
    outputs:
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the next step compares this commit with the newest release tag

      - name: Work out the version
        id: version
        shell: pwsh
        run: packaging/release-version.ps1

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build Loupix.sln -c Release

      - name: Test
        run: dotnet test Loupix.sln -c Release --no-build --logger "console;verbosity=normal"

      - name: Publish (x64 and ARM64, self-contained single file)
        shell: pwsh
        run: |
          foreach ($rid in "win-x64", "win-arm64") {
            dotnet publish src/Loupix/Loupix.csproj -c Release -r $rid --self-contained `
              -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
              -p:EnableCompressionInSingleFile=true -o "out/$rid"
            Copy-Item LICENSE, THIRD-PARTY-NOTICES.md "out/$rid"
            Compress-Archive -Path "out/$rid/*" -DestinationPath "out/Loupix-$rid.zip" -Force
          }
          # Small build (a few MB) for machines with the .NET 10 Desktop Runtime installed.
          dotnet publish src/Loupix/Loupix.csproj -c Release -r win-x64 --self-contained false `
            -p:PublishSingleFile=true -o "out/win-x64-small"
          Copy-Item LICENSE, THIRD-PARTY-NOTICES.md "out/win-x64-small"
          Compress-Archive -Path "out/win-x64-small/*" -DestinationPath "out/Loupix-win-x64-requires-dotnet10.zip" -Force

      - name: Build the installers
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
          Invoke-WebRequest https://www.nuget.org/api/v2/package/Tools.InnoSetup/6.7.3 -OutFile "$env:RUNNER_TEMP\inno.zip"
          Expand-Archive "$env:RUNNER_TEMP\inno.zip" "$env:RUNNER_TEMP\inno"
          foreach ($arch in "x64", "arm64") {
            & "$env:RUNNER_TEMP\inno\tools\ISCC.exe" /Qp "/DAppVersion=$version" "/DArch=$arch" "/DPublishDir=$PWD\out\win-$arch" "/DOutDir=$PWD\out" installer\Loupix.iss
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed for $arch" }
          }

      - name: Check the installer installs and uninstalls
        shell: pwsh
        run: |
          $exe = "$env:LOCALAPPDATA\Programs\Loupix\Loupix.exe"
          $shortcuts = "Desktop", "Programs" | ForEach-Object { Join-Path ([Environment]::GetFolderPath($_)) "Loupix.lnk" }
          Start-Process out\Loupix-Setup-x64.exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          if (-not (Test-Path $exe)) { throw "The installer did not put Loupix.exe in place" }
          if ((Test-Path $shortcuts) -contains $false) { throw "The installer did not create both shortcuts" }
          Start-Process "$env:LOCALAPPDATA\Programs\Loupix\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          Start-Sleep -Seconds 5
          if (Test-Path $exe) { throw "The uninstaller left Loupix.exe behind" }
          if ((Test-Path $shortcuts) -contains $true) { throw "The uninstaller left a shortcut behind" }

      - name: Build the Microsoft Store package
        shell: pwsh
        run: packaging/store/build.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: Loupix-windows
          path: |
            out/*.zip
            out/*.exe
            out/store/*.msixbundle

      # Last, so nothing is published unless every check above passed. The website's download button serves the newest release.
      - name: Release
        if: steps.version.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            out/*.zip
            out/*.exe

  # Sends each release to the Microsoft Store. Microsoft certifies it (a few hours, up to 3 business days) and then publishes it.
  # It signs in as the Entra app in Partner Center > Account settings > User management > Microsoft Entra applications,
  # which needs the Manager role. Its key expires, so renew it there and update MSSTORE_CLIENT_SECRET.
  # A separate job so that if the Store says no, for example because the last update is still in certification,
  # "Re-run failed jobs" on the run tries again without making another release.
  store:
    needs: build
    if: needs.build.outputs.release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Loupix-windows

      - uses: microsoft/microsoft-store-apppublisher@v1.4

      - name: Submit to the Microsoft Store
        shell: pwsh
        env:
          TENANT_ID: ${{ secrets.MSSTORE_TENANT_ID }}
          SELLER_ID: ${{ secrets.MSSTORE_SELLER_ID }}
          CLIENT_ID: ${{ secrets.MSSTORE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
        run: |
          msstore reconfigure --tenantId $env:TENANT_ID --sellerId $env:SELLER_ID --clientId $env:CLIENT_ID --clientSecret $env:CLIENT_SECRET
          if ($LASTEXITCODE -ne 0) { throw 'Could not sign in to Partner Center' }
          # Replaces the package in the previous submission and keeps its listing, price and markets.
          $bundle = Get-Item store/*.msixbundle
          msstore publish $bundle.FullName --appId 9N72XVGTS998
          if ($LASTEXITCODE -ne 0) { throw 'The Store did not accept the submission' }
